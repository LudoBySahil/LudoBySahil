<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Ludo - Game Room</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .match-box { background: #facc15; color: #000; padding: 5px 12px; font-weight: bold; border-radius: 6px; }
        .board-container {
            position: relative;
            width: 350px;
            height: 350px;
            margin: 0 auto;
            background: #cbd5e1;
            border: 4px solid #334155;
            border-radius: 10px;
        }
        .dice-section {
            margin-top: 20px;
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
        }
        .dice-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .dice-display { font-size: 2rem; margin-top: 10px; color: #facc15; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h3>Classic Ludo</h3>
        <div class="match-box" id="matchCodeDisplay">MATCH NO: ----</div>
    </div>

    <!-- Ludo Board Visual Container -->
    <div class="board-container" id="ludoBoard">
        <!-- Yahan ludo board ka visual setup rahega -->
        <h4 style="color: #000; padding-top: 130px;">Ludo Board Arena</h4>
    </div>

    <div class="dice-section">
        <p>Current Turn: <span id="turnDisplay" style="color: #facc15; font-weight: bold;">Red</span></p>
        <button class="dice-btn" onclick="rollDice()">ROLL DICE 🎲</button>
        <div class="dice-display" id="diceResult">-</div>
    </div>

    <script>
        const socket = io();
        
        // URL se match code nikalna
        const urlParams = new URLSearchParams(window.location.search);
        const matchCode = urlParams.get('code') || 'LUDO1234';
        document.getElementById('matchCodeDisplay').innerText = "MATCH NO: " + matchCode;

        let myColor = 'red'; // Default color for testing

        function rollDice() {
            socket.emit('roll_dice', { match_code: matchCode, color: myColor });
        }

        socket.on('dice_result', (data) => {
            document.getElementById('diceResult').innerText = data.dice;
            document.getElementById('turnDisplay').innerText = data.color.toUpperCase();
        });
    </script>
</body>
</html>
